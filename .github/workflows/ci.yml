name: android

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 账本与弹题状态机不依赖 Android 框架，纯 JVM 跑，是 CI 阻断项（开发文档 6.11 T1–T12）
      - name: Gate engine tests
        run: ./gradlew :core-gate:test --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-gate-test-report
          path: core-gate/build/reports/tests/test

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
